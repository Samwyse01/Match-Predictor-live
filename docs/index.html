 ${rs.map(r=>`<div class="line"><span>Line ${r.line}</span><span>Over ${pct(+r.p_over)} (fair ${odds(r.fair_over_odds)})</span><span>Under ${pct(+r.p_under)} (fair ${odds(r.fair_under_odds)})</span></div>`).join("")}
 </div>`}).join("")||'<p class="mut">No rows for this market.</p>'}
function logView(){
 const s=LOG.filter(r=>r.result),K={H:"p_home",D:"p_draw",A:"p_away"},O={H:"odds_home",D:"odds_draw",A:"odds_away"};
 const ok=s.filter(r=>r.pick===r.result).length;
 const ll=s.length?s.reduce((a,r)=>a-Math.log(Math.max(1e-6,+r[K[r.result]])),0)/s.length:0;
 const vb=s.filter(r=>r.value_flag==="True"&&O[r.edge_on]&&r[O[r.edge_on]]);
 const profit=vb.reduce((a,r)=>a+(r.edge_on===r.result?+r[O[r.edge_on]]-1:-1),0);
 const sum=`<div class="card"><div class="teams">Track record</div><div class="mut">${s.length} finished predictions · ${s.length?pct(ok/s.length):"–"} picked right · log loss ${s.length?ll.toFixed(3):"–"} (guessing 33% each way scores 1.099; lower is better)</div><div class="mut">Value flags: ${vb.length} bets, ${profit.toFixed(1)} units profit on 1-unit stakes${vb.length<100?" (far too few bets to judge)":""}</div></div>`;
 const rows=[...LOG].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,60).map(r=>{const d=!!r.result;
  return `<div class="card"><div class="top"><span>${esc(r.date)} · ${esc(r.league)}</span>${d?(r.pick===r.result?'<b class="tag">✓ right</b>':'<b class="tag w">✗ wrong</b>'):'<b class="tag w">pending</b>'}</div><div class="teams">${esc(r.home)} <i>${d?(+r.home_goals)+" – "+(+r.away_goals):"v"}</i> ${esc(r.away)}</div><div class="pr"><span>Home ${pct(+r.p_home)}</span><span>Draw ${pct(+r.p_draw)}</span><span>Away ${pct(+r.p_away)}</span></div><div class="mut">Predicted: ${esc(r.pick)}${d?" · Actual: "+esc(r.result):""}</div></div>`}).join("");
 return sum+(rows||'<p class="mut">No predictions logged yet.</p>')}
function render(){$tabs.innerHTML=TABS.map(([k,l])=>`<button class="${k===tab?"on":""}" data-k="${k}">${l}</button>`).join("");
