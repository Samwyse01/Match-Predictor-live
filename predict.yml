name: daily-predictions
on:
  schedule:
    - cron: "0 6 * * *"   # every day 06:00 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q
      - run: python -m src.predict --totals
      - name: Commit predictions
        run: |
          git config user.name "predictor-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/predictions.csv docs/totals_predictions.csv
          git diff --cached --quiet || (git commit -m "Update predictions" && git push)
